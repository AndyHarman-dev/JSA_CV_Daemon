<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&family=Newsreader:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;height:100%}
    body{font-family:"Geist",system-ui,sans-serif;background:#F4F2ED;color:#1F1B16;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
    textarea,input,button{font-family:inherit}
    @keyframes cvspin{to{transform:rotate(360deg)}}
    @keyframes cvpulse{0%,100%{opacity:.3}50%{opacity:1}}
    @keyframes cvfade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
    @keyframes cvbar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    ::selection{background:color-mix(in srgb,var(--a,#3B5BD9) 20%,transparent)}
    ::-webkit-scrollbar{width:11px;height:11px}
    ::-webkit-scrollbar-thumb{background:#D8D2C8;border-radius:7px;border:3px solid transparent;background-clip:padding-box}
    ::-webkit-scrollbar-thumb:hover{background:#C4BCAE;background-clip:padding-box}
    .cvf{transition:background .12s,border-color .12s,box-shadow .12s}
    .cvf-card:hover:not(:focus){background:#F2F0EA}
    .cvf-card:focus{background:#fff;border-color:color-mix(in srgb,var(--a) 42%,#fff)!important;box-shadow:0 0 0 3px color-mix(in srgb,var(--a) 13%,transparent)}
    .cvf-paper:hover:not(:focus){background:color-mix(in srgb,var(--a) 7%,transparent)}
    .cvf-paper:focus{border-bottom-color:color-mix(in srgb,var(--a) 60%,#fff)!important;background:color-mix(in srgb,var(--a) 6%,transparent)}
    .cvf-paper::placeholder,.cvf-card::placeholder{color:#B8B0A2}
    .cvbtn{transition:background .12s,color .12s,border-color .12s}
    .cvbtn:hover{background:#ECE9E2;color:#1F1B16}
    .cvbtn:disabled{opacity:.3;cursor:default!important}
    .cvbtn:disabled:hover{background:transparent;color:#6B6358}
    .cvprimary{transition:background .14s,box-shadow .14s,transform .05s}
    .cvprimary:hover{background:color-mix(in srgb,var(--a) 88%,#000)}
    .cvprimary:active{transform:translateY(1px)}
    .cvghost{transition:background .12s,border-color .12s}
    .cvghost:hover{background:#EDEAE3;border-color:#CFC8BB}
    .cvsec .cvtools{opacity:0;transition:opacity .14s}
    .cvsec:hover .cvtools,.cvsec:focus-within .cvtools{opacity:1}
    .cvchip{transition:background .12s}
    .cvchip:hover .cvx{opacity:1}
    .cvx{opacity:0;transition:opacity .12s}
    .cvitem .cvih{opacity:0;transition:opacity .12s}
    .cvitem:hover .cvih{opacity:1}
    .cvgap{transition:opacity .12s}
    .cvgap .cvadd{opacity:0;transition:opacity .14s}
    .cvgap:hover .cvadd{opacity:1}
    .cvkindbtn{transition:background .1s,border-color .1s}
    .cvkindbtn:hover{background:#F6F4EF;border-color:color-mix(in srgb,var(--a) 35%,#fff)}
    .cvpapersec{transition:box-shadow .15s}
  </style>
</helmet>
<div style="height:100vh;display:flex;flex-direction:column;min-height:0;background:#F4F2ED;color:#1F1B16">
  {{ topbar }}
  <div style="flex:1;display:flex;min-height:0;overflow:hidden">
    <main style="flex:1;min-width:0;overflow:auto">{{ surface }}</main>
    {{ drawer }}
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:&quot;100%&quot;},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;options&quot;:[&quot;#3B5BD9&quot;,&quot;#2E7D5B&quot;,&quot;#B4530A&quot;,&quot;#6B4E9E&quot;],&quot;default&quot;:&quot;#3B5BD9&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Appearance&quot;},&quot;density&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;comfortable&quot;,&quot;compact&quot;],&quot;default&quot;:&quot;comfortable&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Appearance&quot;},&quot;paperSerif&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Appearance&quot;}}">
class Component extends DCLogic {
  state = {
    cv: null, view: 'blocks', jsonOpen: false,
    inferring: false, inferStep: 0,
    dragId: null, overId: null, armed: null,
    selectedId: null, addOpen: null,
    history: [], hpos: -1,
  };

  // ---- lifecycle ----
  componentDidMount() {
    this._key = (e) => {
      const mod = e.metaKey || e.ctrlKey;
      if (!mod) return;
      const k = e.key.toLowerCase();
      if (k === 'z' && !e.shiftKey) { e.preventDefault(); this.undo(); }
      else if ((k === 'z' && e.shiftKey) || k === 'y') { e.preventDefault(); this.redo(); }
    };
    window.addEventListener('keydown', this._key);
  }
  componentWillUnmount() { window.removeEventListener('keydown', this._key); clearTimeout(this._t); this._timers && this._timers.forEach(clearTimeout); }

  // ---- helpers ----
  clone(o) { return JSON.parse(JSON.stringify(o)); }
  uid() { this._seq = (this._seq || 0) + 1; return 'k' + this._seq + Math.random().toString(36).slice(2, 5); }

  get accent() { return this.props.accent ?? '#3B5BD9'; }
  get compact() { return (this.props.density ?? 'comfortable') === 'compact'; }
  get serif() { return this.props.paperSerif ?? true; }
  get T() {
    const a = this.accent, c = this.compact;
    return {
      a, ui: '"Geist", system-ui, sans-serif', mono: '"Geist Mono", ui-monospace, monospace',
      serifF: '"Newsreader", Georgia, serif',
      canvas: '#F4F2ED', surface: '#FFFFFF', subtle: '#FAF8F4', sunk: '#F0EDE6',
      bd: '#E7E2DA', bd2: '#DCD6CB', ink: '#211C16', ink2: '#6B6358', ink3: '#A39B8D',
      aSoft: `color-mix(in srgb, ${a} 9%, #fff)`, aSoft2: `color-mix(in srgb, ${a} 15%, #fff)`,
      aBorder: `color-mix(in srgb, ${a} 38%, #fff)`,
      pad: c ? 13 : 17, gap: c ? 8 : 12, secGap: c ? 12 : 18,
    };
  }

  KINDS = [
    { kind: 'summary', label: 'Summary', desc: 'A short free-text paragraph', icon: 'text' },
    { kind: 'bullets', label: 'Bullet list', desc: 'A flat list of one-line points', icon: 'list' },
    { kind: 'skills', label: 'Skills', desc: 'Grouped, comma-separated keywords', icon: 'tag' },
    { kind: 'experience', label: 'Experience', desc: 'Roles with company, dates & bullets', icon: 'work' },
    { kind: 'projects', label: 'Projects', desc: 'Named work with links', icon: 'spark' },
    { kind: 'education', label: 'Education', desc: 'Degrees & institutions', icon: 'cap' },
  ];
  kindMeta(k) { return this.KINDS.find(x => x.kind === k) || this.KINDS[0]; }

  // ---- history ----
  _push(cv) {
    const h = this.state.history.slice(0, this.state.hpos + 1);
    h.push(this.clone(cv));
    if (h.length > 120) h.shift();
    this.setState({ history: h, hpos: h.length - 1, cv });
  }
  flush() { if (this._t) { clearTimeout(this._t); this._t = null; if (this._pending) { this._pending = false; this._push(this.state.cv); } } }
  edit(cv) { this.flush(); this._push(cv); }              // structural -> immediate snapshot
  editText(cv) {                                          // typing -> coalesced snapshot
    this.setState({ cv });
    clearTimeout(this._t); this._pending = true;
    this._t = setTimeout(() => { this._pending = false; this._t = null; this._push(this.state.cv); }, 600);
  }
  undo() { this.flush(); const { hpos, history } = this.state; if (hpos > 0) this.setState({ hpos: hpos - 1, cv: this.clone(history[hpos - 1]) }); }
  redo() { const { hpos, history } = this.state; if (hpos < history.length - 1) this.setState({ hpos: hpos + 1, cv: this.clone(history[hpos + 1]) }); }
  loadCv(cv) { this.setState({ cv, history: [this.clone(cv)], hpos: 0, selectedId: cv.sections[0] && cv.sections[0].id }); }

  // ---- mutation primitives ----
  withSection(id, fn, text) {
    const cv = this.clone(this.state.cv);
    const s = cv.sections.find(x => x.id === id);
    if (s) fn(s, cv);
    text ? this.editText(cv) : this.edit(cv);
  }
  withEntry(sid, eid, fn, text) {
    this.withSection(sid, (s) => { const e = s.entries.find(x => x.id === eid); if (e) fn(e, s); }, text);
  }
  setContact(field, val) { const cv = this.clone(this.state.cv); cv.contact[field] = val; this.editText(cv); }

  newEntry(kind) {
    const e = { id: this.uid() };
    if (kind === 'skills') { e.heading = ''; e.bullets = ['']; }
    else if (kind === 'projects') { e.heading = ''; e.text = ''; e.bullets = []; e.links = ['']; }
    else if (kind === 'education') { e.heading = ''; e.subheading = ''; e.dates = ''; e.location = ''; }
    else { e.heading = ''; e.subheading = ''; e.dates = ''; e.location = ''; e.bullets = ['']; }
    return e;
  }
  newSection(kind) {
    const m = this.kindMeta(kind);
    const s = { id: this.uid(), kind, name: m.label, text: '', items: [], entries: [] };
    if (kind === 'bullets') s.items = [''];
    else if (kind !== 'summary') s.entries = [this.newEntry(kind)];
    return s;
  }
  addSection(kind, atKey) {
    const cv = this.clone(this.state.cv);
    const ns = this.newSection(kind);
    if (atKey === 'end' || atKey == null) cv.sections.push(ns);
    else { const i = cv.sections.findIndex(s => s.id === atKey); cv.sections.splice(i + 1, 0, ns); }
    this.edit(cv);
    this.setState({ addOpen: null, selectedId: ns.id });
  }
  delSection(id) { const cv = this.clone(this.state.cv); cv.sections = cv.sections.filter(s => s.id !== id); this.edit(cv); }
  moveSection(id, dir) {
    const cv = this.clone(this.state.cv); const a = cv.sections;
    const i = a.findIndex(s => s.id === id), j = i + dir;
    if (j < 0 || j >= a.length) return;
    [a[i], a[j]] = [a[j], a[i]]; this.edit(cv);
  }
  reorder(targetId) {
    const cv = this.clone(this.state.cv); const a = cv.sections;
    const from = a.findIndex(s => s.id === this.state.dragId);
    const to = a.findIndex(s => s.id === targetId);
    if (from < 0 || to < 0 || from === to) { this.setState({ dragId: null, overId: null, armed: null }); return; }
    const [m] = a.splice(from, 1); a.splice(to, 0, m);
    this._push(cv); this.setState({ dragId: null, overId: null, armed: null });
  }
  moveEntry(sid, eid, dir) {
    this.withSection(sid, (s) => { const a = s.entries; const i = a.findIndex(e => e.id === eid), j = i + dir; if (j < 0 || j >= a.length) return; [a[i], a[j]] = [a[j], a[i]]; });
  }

  // ---- sample + infer ----
  blankCv() { return { contact: { name: '', email: '', phone: '', location: '', links: [] }, sections: [this.newSection('summary')] }; }
  sampleCv() {
    const E = (o) => ({ id: this.uid(), ...o });
    return {
      contact: { name: 'Daniel Okafor', email: 'daniel.okafor@gmail.com', phone: '+1 (415) 555-0147', location: 'Austin, TX', links: ['github.com/danokafor', 'linkedin.com/in/danokafor'] },
      sections: [
        { id: this.uid(), kind: 'summary', name: 'Summary', items: [], entries: [],
          text: 'Gameplay and engine programmer with 7+ years shipping titles on Unreal Engine 4/5. Specialized in C++ systems, networked multiplayer, and performance profiling across PC and console. Comfortable owning features end-to-end, from prototype to cert.' },
        { id: this.uid(), kind: 'experience', name: 'Experience', text: '', items: [], entries: [
          E({ heading: 'Senior Gameplay Programmer', subheading: 'Hidden Forge Studios', dates: '2021 — Present', location: 'Austin, TX', bullets: [
            'Architected the ability system for a UE5 third-person action title, supporting 60+ networked abilities with client-side prediction.',
            'Cut frame-time spikes 38% by profiling and rebudgeting the animation pipeline with Unreal Insights.',
            'Mentored four junior engineers and owned the gameplay code-review process.' ], links: [] }),
          E({ heading: 'Engine Programmer', subheading: 'Voltline Interactive', dates: '2018 — 2021', location: 'Remote', bullets: [
            'Built a custom replication-graph extension that halved bandwidth for 64-player matches.',
            'Integrated PlayStation and Xbox platform SDKs, shipping two titles through certification.' ], links: [] }),
          E({ heading: 'Gameplay Programmer', subheading: 'Pixel Anvil', dates: '2016 — 2018', location: 'Dallas, TX', bullets: [
            'Implemented AI behavior trees and EQS queries for a stealth title.' ], links: [] }),
        ] },
        { id: this.uid(), kind: 'projects', name: 'Projects', text: '', items: [], entries: [
          E({ heading: 'Replication Profiler', text: 'Open-source UE5 plugin that visualizes per-actor replication cost in real time.', bullets: [], links: ['github.com/danokafor/rep-profiler'] }),
          E({ heading: 'Forge Combat Framework', text: 'Modular melee + ranged combat starter kit, 1.2k stars on GitHub.', bullets: [], links: ['github.com/danokafor/forge-combat'] }),
        ] },
        { id: this.uid(), kind: 'skills', name: 'Skills', text: '', items: [], entries: [
          E({ heading: 'Languages', bullets: ['C++', 'Blueprint', 'Python', 'C#'] }),
          E({ heading: 'Engines & Tools', bullets: ['Unreal Engine 4/5', 'Unreal Insights', 'Perforce', 'RenderDoc'] }),
          E({ heading: 'Systems', bullets: ['Gameplay Ability System', 'Replication', 'Behavior Trees', 'Animation'] }),
          E({ heading: 'Platforms', bullets: ['PC', 'PlayStation', 'Xbox', 'Switch'] }),
        ] },
        { id: this.uid(), kind: 'bullets', name: 'Highlights', text: '', entries: [], items: [
          'Shipped 5 titles to retail', 'Speaker, Unreal Fest 2024', 'GDC mentor, 2022–2024' ] },
        { id: this.uid(), kind: 'education', name: 'Education', text: '', items: [], entries: [
          E({ heading: 'B.S. Computer Science', subheading: 'University of Texas at Austin', dates: '2012 — 2016', location: 'Austin, TX' }),
        ] },
      ],
    };
  }
  startInfer() {
    const steps = ['Reading document…', 'Detecting section breaks…', 'Extracting entries & dates…', 'Structuring JSON…', 'Validating against schema…'];
    this.setState({ inferring: true, inferStep: 0, cv: null });
    this._timers = [];
    steps.forEach((_, i) => this._timers.push(setTimeout(() => this.setState({ inferStep: i + 1 }), 480 * (i + 1))));
    this._timers.push(setTimeout(() => { this.setState({ inferring: false, view: 'blocks' }); this.loadCv(this.sampleCv()); }, 480 * steps.length + 520));
  }

  // ---- JSON export (schema shape) ----
  exportJson() {
    const cv = this.state.cv; if (!cv) return {};
    const c = cv.contact, contact = { name: c.name || '' };
    ['email', 'phone', 'location'].forEach(k => { if (c[k]) contact[k] = c[k]; });
    if (c.links && c.links.filter(Boolean).length) contact.links = c.links.filter(Boolean);
    const sections = cv.sections.map(s => {
      const o = { name: s.name || '' };
      if (s.text && s.text.trim()) o.text = s.text.trim();
      const items = (s.items || []).filter(x => x && x.trim());
      if (items.length) o.items = items;
      const entries = (s.entries || []).map(e => {
        const eo = {};
        ['heading', 'subheading', 'dates', 'location', 'text'].forEach(k => { if (e[k] && e[k].trim()) eo[k] = e[k].trim(); });
        const b = (e.bullets || []).filter(x => x && x.trim()); if (b.length) eo.bullets = b;
        const l = (e.links || []).filter(x => x && x.trim()); if (l.length) eo.links = l;
        return eo;
      }).filter(eo => Object.keys(eo).length);
      if (entries.length) o.entries = entries;
      return o;
    });
    return { contact, sections };
  }

  // ======================================================= RENDER HELPERS

    const h = React.createElement;
    const P = (d, extra) => h('path', { d, ...extra });
    const C = (cx, cy) => h('circle', { cx, cy, r: 1, fill: 'currentColor', stroke: 'none' });
    const map = {
      up: [P('M3.5 9.5L8 5l4.5 4.5')], down: [P('M3.5 6.5L8 11l4.5-4.5')],
      plus: [P('M8 3.2v9.6M3.2 8h9.6')], x: [P('M4 4l8 8M12 4l-8 8')],
      check: [P('M3 8.4l3.3 3.4L13 4.6')],
      trash: [P('M3 4.5h10M6.4 4.5V3.2h3.2v1.3M4.6 4.5l.6 8.3h5.6l.6-8.3')],
      undo: [P('M6.5 4L3 7.2l3.5 3.2'), P('M3 7.2h6.2a3.4 3.4 0 0 1 0 6.8H6.6')],
      redo: [P('M9.5 4L13 7.2l-3.5 3.2'), P('M13 7.2H6.8a3.4 3.4 0 0 0 0 6.8h2.6')],
      braces: [P('M6.2 3C4.6 3 5 5 5 6.2c0 1-.5 1.6-1.6 1.8 1.1.2 1.6.8 1.6 1.8C5 11 4.6 13 6.2 13'), P('M9.8 3c1.6 0 1.2 2 1.2 3.2 0 1 .5 1.6 1.6 1.8-1.1.2-1.6.8-1.6 1.8 0 1.2.4 3.2-1.2 3.2')],
      spark: [P('M8 2.2l1.3 3.9 3.9 1.3-3.9 1.3L8 12.6 6.7 8.7 2.8 7.4l3.9-1.3z')],
      eye: [P('M1.2 8S3.6 3.6 8 3.6 14.8 8 14.8 8 12.4 12.4 8 12.4 1.2 8 1.2 8z'), h('circle', { cx: 8, cy: 8, r: 1.9 })],
      link: [P('M6.5 9.5l3-3M7 5.2l.8-.8a2.4 2.4 0 0 1 3.4 3.4l-.9.9M9 10.8l-.8.8a2.4 2.4 0 0 1-3.4-3.4l.9-.9')],
      copy: [h('rect', { x: 5.2, y: 5.2, width: 7.6, height: 7.6, rx: 1.6 }), P('M3.2 10.8V4a.8.8 0 0 1 .8-.8h6.8')],
      text: [P('M3.5 4.5h9M3.5 8h9M3.5 11.5h5.5')],
      list: [C(4, 4.5), C(4, 8), C(4, 11.5), P('M6.8 4.5h6M6.8 8h6M6.8 11.5h4')],
      tag: [P('M8.3 2.8H12a1.2 1.2 0 0 1 1.2 1.2v3.7a1 1 0 0 1-.3.7l-5 5a1 1 0 0 1-1.4 0L3 9.5a1 1 0 0 1 0-1.4l5-5a1 1 0 0 1 .3-.3z'), h('circle', { cx: 10.3, cy: 5.7, r: .9 })],
      work: [h('rect', { x: 2.5, y: 5, width: 11, height: 7.5, rx: 1.2 }), P('M6 5V4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v1')],
      cap: [P('M8 3L1.8 6 8 9l6.2-3L8 3z'), P('M4.5 7.3v3c0 .9 1.6 1.7 3.5 1.7s3.5-.8 3.5-1.7v-3')],
      blocks: [h('rect', { x: 2.5, y: 3, width: 11, height: 3.4, rx: 1 }), h('rect', { x: 2.5, y: 9.6, width: 11, height: 3.4, rx: 1 })],
      doc: [h('rect', { x: 3.5, y: 2.2, width: 9, height: 11.6, rx: 1.2 }), P('M5.8 5.4h4.4M5.8 8h4.4M5.8 10.6h2.6')],
      cols: [h('rect', { x: 2.4, y: 2.8, width: 11.2, height: 10.4, rx: 1.4 }), P('M8 2.8v10.4')],
    };
    return h('svg', { width: sz, height: sz, viewBox: '0 0 16 16', fill: 'none', stroke: 'currentColor', strokeWidth: 1.55, strokeLinecap: 'round', strokeLinejoin: 'round', style: { display: 'block', color: color || 'currentColor', flex: 'none' } }, map[name] || []);
  }
  grip(color, sz) {
    const h = React.createElement, c = color || '#B7AF9F', s = sz || 16;
    const dots = [[5, 4], [11, 4], [5, 8], [11, 8], [5, 12], [11, 12]].map(([x, y], i) => h('circle', { key: i, cx: x, cy: y, r: 1.25, fill: c }));
    return h('svg', { width: s, height: s, viewBox: '0 0 16 16', style: { display: 'block' } }, dots);
  }

  iconBtn(name, onClick, o = {}) {
    const h = React.createElement, T = this.T;
    return h('button', { onClick, disabled: o.disabled, title: o.title, className: 'cvbtn', style: { display: 'inline-flex', alignItems: 'center', justifyContent: 'center', width: o.sz || 28, height: o.sz || 28, border: 'none', background: o.bg || 'transparent', color: o.color || T.ink2, borderRadius: 7, cursor: 'pointer', padding: 0, flex: 'none' } }, this.icon(name, o.isz || 15));
  }

  field(val, onChange, o = {}) {
    const h = React.createElement, T = this.T, paper = o.variant === 'paper';
    const base = paper
      ? { font: 'inherit', color: o.color || 'inherit', textAlign: o.align || 'inherit', letterSpacing: 'inherit', textTransform: 'inherit', border: 'none', borderBottom: '1px solid transparent', outline: 'none', background: 'transparent', padding: '0 1px', margin: 0, borderRadius: 2, width: o.width || '100%' }
      : { font: `${o.weight || 400} ${o.size || 14}px/1.55 ${T.ui}`, color: o.color || T.ink, border: '1px solid transparent', borderRadius: 8, outline: 'none', background: 'transparent', padding: o.pad || '6px 9px', width: '100%', margin: 0 };
    const cls = 'cvf ' + (paper ? 'cvf-paper' : 'cvf-card');
    const common = { value: val || '', placeholder: o.ph || '', spellCheck: false, className: cls, onChange: e => onChange(e.target.value), style: base };
    if (o.onKeyDown) common.onKeyDown = o.onKeyDown;
    if (o.multiline) return h('textarea', { ...common, rows: 1, style: { ...base, resize: 'none', fieldSizing: 'content', minHeight: paper ? undefined : '1.6em', overflow: 'hidden', display: 'block' } });
    return h('input', { ...common, type: 'text' });
  }

  // tag editor for skills (chips + add input)
