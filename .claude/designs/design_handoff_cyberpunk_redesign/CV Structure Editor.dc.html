<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Share+Tech+Mono&family=Newsreader:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;height:100%}
    body{font-family:"IBM Plex Sans",system-ui,sans-serif;background:#070A0F;color:#E8EEF2;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
    textarea,input,button{font-family:inherit}
    @keyframes cvspin{to{transform:rotate(360deg)}}
    @keyframes cvpulse{0%,100%{opacity:.35}50%{opacity:1}}
    @keyframes cvfade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
    @keyframes cvbar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    @keyframes cyscan{from{background-position:0 0}to{background-position:0 160vh}}
    @keyframes cyblink{0%,49%{opacity:1}50%,100%{opacity:.2}}
    ::selection{background:color-mix(in srgb,var(--a,#F4CE4A) 30%,transparent);color:#fff}
    ::-webkit-scrollbar{width:10px;height:10px}
    ::-webkit-scrollbar-thumb{background:#1C232C;border-radius:3px;border:2px solid transparent;background-clip:padding-box}
    ::-webkit-scrollbar-thumb:hover{background:#28323D;background-clip:padding-box}
    .cvf{transition:background .12s,border-color .12s,box-shadow .12s}
    .cvf-card:hover:not(:focus){background:#161D27}
    .cvf-card:focus{background:#0E141B;border-color:color-mix(in srgb,var(--a,#F4CE4A) 55%,#0E141B)!important;box-shadow:0 0 0 3px color-mix(in srgb,var(--a,#F4CE4A) 18%,transparent)}
    .cvf-paper:hover:not(:focus){background:color-mix(in srgb,var(--pa,#2563EB) 7%,transparent)}
    .cvf-paper:focus{border-bottom-color:color-mix(in srgb,var(--pa,#2563EB) 60%,#fff)!important;background:color-mix(in srgb,var(--pa,#2563EB) 6%,transparent)}
    .cvf-card::placeholder{color:#46505C}
    .cvf-paper::placeholder{color:#B8B0A2}
    .cvbtn{transition:background .12s,color .12s,border-color .12s}
    .cvbtn:hover{background:#1B232C;color:#E8EEF2}
    .cvbtn:disabled{opacity:.3;cursor:default!important}
    .cvbtn:disabled:hover{background:transparent;color:#5A6472}
    .cvbtn-light{transition:background .12s,color .12s}
    .cvbtn-light:hover{background:#EFEDE6}
    .cvbtn-light:disabled{opacity:.3;cursor:default!important}
    .cvbtn-light:disabled:hover{background:transparent}
    .cvprimary{transition:background .14s,box-shadow .14s,transform .05s}
    .cvprimary:hover{background:color-mix(in srgb,var(--a,#F4CE4A) 85%,#fff)}
    .cvprimary:active{transform:translateY(1px)}
    .cvghost{transition:background .12s,border-color .12s}
    .cvghost:hover{background:#141B23;border-color:color-mix(in srgb,var(--a,#F4CE4A) 45%,#2A3440)}
    .cvsec .cvtools{opacity:0;transition:opacity .14s}
    .cvsec:hover .cvtools,.cvsec:focus-within .cvtools{opacity:1}
    .cvchip{transition:background .12s}
    .cvchip:hover .cvx{opacity:1}
    .cvx{opacity:0;transition:opacity .12s}
    .cvitem .cvih{opacity:0;transition:opacity .12s}
    .cvitem:hover .cvih{opacity:1}
    .cvgap{transition:opacity .12s}
    .cvgap .cvadd{opacity:0;transition:opacity .14s}
    .cvgap:hover .cvadd{opacity:1}
    .cvkindbtn{transition:background .1s,border-color .1s}
    .cvkindbtn:hover{background:#141B23;border-color:color-mix(in srgb,var(--a,#F4CE4A) 40%,#2A3440)}
    .cvpapersec{transition:box-shadow .15s}
  </style>
</helmet>
{{ themeStyle }}
<div style="height:100vh;display:flex;flex-direction:column;min-height:0;background:#070A0F;color:#E8EEF2;position:relative;overflow:hidden">
  {{ ambient }}
  {{ topbar }}
  <div style="flex:1;display:flex;min-height:0;overflow:hidden;position:relative;z-index:1">
    <main style="flex:1;min-width:0;overflow:auto;position:relative">{{ surface }}</main>
    {{ drawer }}
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:&quot;100%&quot;},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;options&quot;:[&quot;#F4CE4A&quot;,&quot;#33E6E6&quot;,&quot;#FF4655&quot;,&quot;#FF2BD6&quot;],&quot;default&quot;:&quot;#F4CE4A&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Appearance&quot;},&quot;density&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;comfortable&quot;,&quot;compact&quot;],&quot;default&quot;:&quot;comfortable&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Appearance&quot;},&quot;paperSerif&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Appearance&quot;},&quot;skin&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;terminal&quot;,&quot;hud&quot;],&quot;default&quot;:&quot;terminal&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Daemon&quot;},&quot;telemetry&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Daemon&quot;},&quot;onExit&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  state = {
    cv: null, view: 'blocks', jsonOpen: false,
    inferring: false, inferProgress: {}, inferElapsed: 0,
    dragId: null, overId: null, armed: null,
    selectedId: null, addOpen: null,
    history: [], hpos: -1, clockTick: 0,
  };

  KINDS = [
    { kind: 'summary', label: 'Summary', code: 'SUM', desc: 'A short free-text paragraph', icon: 'text' },
    { kind: 'bullets', label: 'Bullet list', code: 'LST', desc: 'A flat list of one-line points', icon: 'list' },
    { kind: 'skills', label: 'Skills', code: 'SKL', desc: 'Grouped, comma-separated keywords', icon: 'tag' },
    { kind: 'experience', label: 'Experience', code: 'EXP', desc: 'Roles with company, dates & bullets', icon: 'work' },
    { kind: 'projects', label: 'Projects', code: 'PRJ', desc: 'Named work with links', icon: 'spark' },
    { kind: 'education', label: 'Education', code: 'EDU', desc: 'Degrees & institutions', icon: 'cap' },
  ];

  THREADS = [
    { key: 'parse', label: 'PARSE_DOCUMENT', delay: 0, dur: 1000 },
    { key: 'segment', label: 'SEGMENT_SECTIONS', delay: 180, dur: 1300 },
    { key: 'extract', label: 'EXTRACT_ENTRIES', delay: 320, dur: 1700 },
    { key: 'structure', label: 'STRUCTURE_JSON', delay: 260, dur: 1450 },
    { key: 'validate', label: 'VALIDATE_SCHEMA', delay: 620, dur: 820 },
  ];

  // ---- lifecycle ----
  componentDidMount() {
    this._key = (e) => {
      const mod = e.metaKey || e.ctrlKey;
      if (!mod) return;
      const k = e.key.toLowerCase();
      if (k === 'z' && !e.shiftKey) { e.preventDefault(); this.undo(); }
      else if ((k === 'z' && e.shiftKey) || k === 'y') { e.preventDefault(); this.redo(); }
    };
    window.addEventListener('keydown', this._key);
    this._session = Array.from({ length: 6 }, () => '0123456789ABCDEF'[Math.floor(Math.random() * 16)]).join('');
    this._clockInt = setInterval(() => this.setState(s => ({ clockTick: (s.clockTick || 0) + 1 })), 1000);
  }
  componentWillUnmount() {
    window.removeEventListener('keydown', this._key);
    clearTimeout(this._t);
    clearInterval(this._tick);
    clearInterval(this._clockInt);
  }

  // ---- helpers ----
  clone(o) { return JSON.parse(JSON.stringify(o)); }
  uid() { this._seq = (this._seq || 0) + 1; return 'k' + this._seq + Math.random().toString(36).slice(2, 5); }

  get accent() { return this.props.accent ?? '#F4CE4A'; }
  get compact() { return (this.props.density ?? 'comfortable') === 'compact'; }
  get serif() { return this.props.paperSerif ?? true; }
  get T() {
    const a = this.accent, c = this.compact;
    const chamfer = (this.props.skin ?? 'terminal') === 'hud';
    return {
      a, accent2: '#33E6E6', danger: '#FF4655',
      ui: '"IBM Plex Sans", system-ui, sans-serif',
      mono: '"Share Tech Mono", ui-monospace, monospace',
      disp: '"Chakra Petch", system-ui, sans-serif',
      canvas: '#070A0F', surface: '#10151D', subtle: '#0E141B', sunk: '#0B0F15',
      bd: 'rgba(140,190,210,0.16)', bd2: 'rgba(140,190,210,0.30)',
      ink: '#E8EEF2', ink2: '#8B97A6', ink3: '#4D5868',
      aSoft: `color-mix(in srgb, ${a} 14%, #10151D)`,
      aSoft2: `color-mix(in srgb, ${a} 24%, #10151D)`,
      aBorder: `color-mix(in srgb, ${a} 55%, #10151D)`,
      pad: c ? 13 : 17, gap: c ? 8 : 12, secGap: c ? 12 : 18,
      chamfer, radius: chamfer ? 0 : 3, btnRadius: chamfer ? 7 : 2,
      shadowSm: '0 1px 2px rgba(0,0,0,.4)', shadowMd: '0 10px 32px rgba(0,0,0,.55)',
      paperAccent: '#2563EB',
    };
  }
  get paperT() {
    return {
      a: '#2563EB', ui: '"IBM Plex Sans", system-ui, sans-serif', mono: '"Share Tech Mono", ui-monospace, monospace',
      serifF: '"Newsreader", Georgia, serif',
      surface: '#FCFBF8', bd: '#E3DFD6', ink: '#211C16', ink2: '#6B6358', ink3: '#A39B8D',
    };
  }

  kindMeta(k) { return this.KINDS.find(x => x.kind === k) || this.KINDS[0]; }

  // ---- skin chrome helpers ----
  chamferPath(c) { return `polygon(0 0, calc(100% - ${c}px) 0, 100% ${c}px, 100% 100%, ${c}px 100%, 0 calc(100% - ${c}px))`; }
  panelBase(o = {}) {
    const T = this.T;
    const st = { background: o.bg || T.surface, border: `1px solid ${o.border || T.bd}` };
    if (T.chamfer) { st.clipPath = this.chamferPath(o.chamfer || 12); st.borderRadius = 0; }
    else { st.borderRadius = o.radius != null ? o.radius : T.radius; }
    return st;
  }
  cornerMarks(color, sz, thick) {
    const h = React.createElement;
    if (this.T.chamfer) return [];
    sz = sz || 9; thick = thick || 2;
    const base = { position: 'absolute', width: sz, height: sz, pointerEvents: 'none' };
    return [
      h('span', { key: 'cmtl', style: { ...base, top: -1, left: -1, borderTop: `${thick}px solid ${color}`, borderLeft: `${thick}px solid ${color}` } }),
      h('span', { key: 'cmtr', style: { ...base, top: -1, right: -1, borderTop: `${thick}px solid ${color}`, borderRight: `${thick}px solid ${color}` } }),
      h('span', { key: 'cmbl', style: { ...base, bottom: -1, left: -1, borderBottom: `${thick}px solid ${color}`, borderLeft: `${thick}px solid ${color}` } }),
      h('span', { key: 'cmbr', style: { ...base, bottom: -1, right: -1, borderBottom: `${thick}px solid ${color}`, borderRight: `${thick}px solid ${color}` } }),
    ];
  }

  // ---- history ----
  _push(cv) {
    const h = this.state.history.slice(0, this.state.hpos + 1);
    h.push(this.clone(cv));
    if (h.length > 120) h.shift();
    this.setState({ history: h, hpos: h.length - 1, cv });
  }
  flush() { if (this._t) { clearTimeout(this._t); this._t = null; if (this._pending) { this._pending = false; this._push(this.state.cv); } } }
  edit(cv) { this.flush(); this._push(cv); }
  editText(cv) {
    this.setState({ cv });
    clearTimeout(this._t); this._pending = true;
    this._t = setTimeout(() => { this._pending = false; this._t = null; this._push(this.state.cv); }, 600);
  }
  undo() { this.flush(); const { hpos, history } = this.state; if (hpos > 0) this.setState({ hpos: hpos - 1, cv: this.clone(history[hpos - 1]) }); }
  redo() { const { hpos, history } = this.state; if (hpos < history.length - 1) this.setState({ hpos: hpos + 1, cv: this.clone(history[hpos + 1]) }); }
  loadCv(cv) { this.setState({ cv, history: [this.clone(cv)], hpos: 0, selectedId: cv.sections[0] && cv.sections[0].id }); }

  // ---- mutation primitives ----
  withSection(id, fn, text) {
    const cv = this.clone(this.state.cv);
    const s = cv.sections.find(x => x.id === id);
    if (s) fn(s, cv);
    text ? this.editText(cv) : this.edit(cv);
  }
  withEntry(sid, eid, fn, text) {
    this.withSection(sid, (s) => { const e = s.entries.find(x => x.id === eid); if (e) fn(e, s); }, text);
  }
  setContact(field, val) { const cv = this.clone(this.state.cv); cv.contact[field] = val; this.editText(cv); }

  newEntry(kind) {
    const e = { id: this.uid() };
    if (kind === 'skills') { e.heading = ''; e.bullets = ['']; }
    else if (kind === 'projects') { e.heading = ''; e.text = ''; e.bullets = []; e.links = ['']; }
    else if (kind === 'education') { e.heading = ''; e.subheading = ''; e.dates = ''; e.location = ''; }
    else { e.heading = ''; e.subheading = ''; e.dates = ''; e.location = ''; e.bullets = ['']; }
    return e;
  }
  newSection(kind) {
    const m = this.kindMeta(kind);
    const s = { id: this.uid(), kind, name: m.label, text: '', items: [], entries: [] };
    if (kind === 'bullets') s.items = [''];
    else if (kind !== 'summary') s.entries = [this.newEntry(kind)];
    return s;
  }
  addSection(kind, atKey) {
    const cv = this.clone(this.state.cv);
    const ns = this.newSection(kind);
    if (atKey === 'end' || atKey == null) cv.sections.push(ns);
    else { const i = cv.sections.findIndex(s => s.id === atKey); cv.sections.splice(i + 1, 0, ns); }
    this.edit(cv);
    this.setState({ addOpen: null, selectedId: ns.id });
  }
  delSection(id) { const cv = this.clone(this.state.cv); cv.sections = cv.sections.filter(s => s.id !== id); this.edit(cv); }
  moveSection(id, dir) {
    const cv = this.clone(this.state.cv); const a = cv.sections;
    const i = a.findIndex(s => s.id === id), j = i + dir;
    if (j < 0 || j >= a.length) return;
    [a[i], a[j]] = [a[j], a[i]]; this.edit(cv);
  }
  reorder(targetId) {
    const cv = this.clone(this.state.cv); const a = cv.sections;
    const from = a.findIndex(s => s.id === this.state.dragId);
    const to = a.findIndex(s => s.id === targetId);
    if (from < 0 || to < 0 || from === to) { this.setState({ dragId: null, overId: null, armed: null }); return; }
    const [m] = a.splice(from, 1); a.splice(to, 0, m);
    this._push(cv); this.setState({ dragId: null, overId: null, armed: null });
  }
  moveEntry(sid, eid, dir) {
    this.withSection(sid, (s) => { const a = s.entries; const i = a.findIndex(e => e.id === eid), j = i + dir; if (j < 0 || j >= a.length) return; [a[i], a[j]] = [a[j], a[i]]; });
  }

  // ---- sample + infer ----
  blankCv() { return { contact: { name: '', email: '', phone: '', location: '', links: [] }, sections: [this.newSection('summary')] }; }
  sampleCv() {
    const E = (o) => ({ id: this.uid(), ...o });
    return {
      contact: { name: 'Daniel Okafor', email: 'daniel.okafor@gmail.com', phone: '+1 (415) 555-0147', location: 'Austin, TX', links: ['github.com/danokafor', 'linkedin.com/in/danokafor'] },
      sections: [
        { id: this.uid(), kind: 'summary', name: 'Summary', items: [], entries: [],
          text: 'Gameplay and engine programmer with 7+ years shipping titles on Unreal Engine 4/5. Specialized in C++ systems, networked multiplayer, and performance profiling across PC and console. Comfortable owning features end-to-end, from prototype to cert.' },
        { id: this.uid(), kind: 'experience', name: 'Experience', text: '', items: [], entries: [
          E({ heading: 'Senior Gameplay Programmer', subheading: 'Hidden Forge Studios', dates: '2021 — Present', location: 'Austin, TX', bullets: [
            'Architected the ability system for a UE5 third-person action title, supporting 60+ networked abilities with client-side prediction.',
            'Cut frame-time spikes 38% by profiling and rebudgeting the animation pipeline with Unreal Insights.',
            'Mentored four junior engineers and owned the gameplay code-review process.' ], links: [] }),
          E({ heading: 'Engine Programmer', subheading: 'Voltline Interactive', dates: '2018 — 2021', location: 'Remote', bullets: [
            'Built a custom replication-graph extension that halved bandwidth for 64-player matches.',
            'Integrated PlayStation and Xbox platform SDKs, shipping two titles through certification.' ], links: [] }),
          E({ heading: 'Gameplay Programmer', subheading: 'Pixel Anvil', dates: '2016 — 2018', location: 'Dallas, TX', bullets: [
            'Implemented AI behavior trees and EQS queries for a stealth title.' ], links: [] }),
        ] },
        { id: this.uid(), kind: 'projects', name: 'Projects', text: '', items: [], entries: [
          E({ heading: 'Replication Profiler', text: 'Open-source UE5 plugin that visualizes per-actor replication cost in real time.', bullets: [], links: ['github.com/danokafor/rep-profiler'] }),
          E({ heading: 'Forge Combat Framework', text: 'Modular melee + ranged combat starter kit, 1.2k stars on GitHub.', bullets: [], links: ['github.com/danokafor/forge-combat'] }),
        ] },
        { id: this.uid(), kind: 'skills', name: 'Skills', text: '', items: [], entries: [
          E({ heading: 'Languages', bullets: ['C++', 'Blueprint', 'Python', 'C#'] }),
          E({ heading: 'Engines & Tools', bullets: ['Unreal Engine 4/5', 'Unreal Insights', 'Perforce', 'RenderDoc'] }),
          E({ heading: 'Systems', bullets: ['Gameplay Ability System', 'Replication', 'Behavior Trees', 'Animation'] }),
          E({ heading: 'Platforms', bullets: ['PC', 'PlayStation', 'Xbox', 'Switch'] }),
        ] },
        { id: this.uid(), kind: 'bullets', name: 'Highlights', text: '', entries: [], items: [
          'Shipped 5 titles to retail', 'Speaker, Unreal Fest 2024', 'GDC mentor, 2022–2024' ] },
        { id: this.uid(), kind: 'education', name: 'Education', text: '', items: [], entries: [
          E({ heading: 'B.S. Computer Science', subheading: 'University of Texas at Austin', dates: '2012 — 2016', location: 'Austin, TX' }),
        ] },
      ],
    };
  }
  startInfer() {
    const progress = {}; this.THREADS.forEach(t => progress[t.key] = 0);
    this.setState({ inferring: true, inferProgress: progress, inferElapsed: 0, cv: null });
    const t0 = performance.now();
    const total = Math.max(...this.THREADS.map(t => t.delay + t.dur));
    clearInterval(this._tick);
    this._tick = setInterval(() => {
      const elapsed = performance.now() - t0;
      const next = {};
      this.THREADS.forEach(t => { next[t.key] = Math.max(0, Math.min(100, (elapsed - t.delay) / t.dur * 100)); });
      this.setState({ inferProgress: next, inferElapsed: elapsed });
      if (elapsed >= total + 280) {
        clearInterval(this._tick);
        this.setState({ inferring: false, view: 'blocks' });
        this.loadCv(this.sampleCv());
      }
    }, 60);
  }

  // ---- JSON export (schema shape) ----
  exportJson() {
    const cv = this.state.cv; if (!cv) return {};
    const c = cv.contact, contact = { name: c.name || '' };
    ['email', 'phone', 'location'].forEach(k => { if (c[k]) contact[k] = c[k]; });
    if (c.links && c.links.filter(Boolean).length) contact.links = c.links.filter(Boolean);
    const sections = cv.sections.map(s => {
      const o = { name: s.name || '' };
      if (s.text && s.text.trim()) o.text = s.text.trim();
      const items = (s.items || []).filter(x => x && x.trim());
      if (items.length) o.items = items;
      const entries = (s.entries || []).map(e => {
        const eo = {};
        ['heading', 'subheading', 'dates', 'location', 'text'].forEach(k => { if (e[k] && e[k].trim()) eo[k] = e[k].trim(); });
        const b = (e.bullets || []).filter(x => x && x.trim()); if (b.length) eo.bullets = b;
        const l = (e.links || []).filter(x => x && x.trim()); if (l.length) eo.links = l;
        return eo;
      }).filter(eo => Object.keys(eo).length);
      if (entries.length) o.entries = entries;
      return o;
    });
    return { contact, sections };
  }

  // ======================================================= RENDER HELPERS
  icon(name, sz, color) {
    const h = React.createElement;
    const P = (d, extra) => h('path', { d, ...extra });
    const C = (cx, cy) => h('circle', { cx, cy, r: 1, fill: 'currentColor', stroke: 'none' });
    const map = {
      up: [P('M3.5 9.5L8 5l4.5 4.5')], down: [P('M3.5 6.5L8 11l4.5-4.5')],
      plus: [P('M8 3.2v9.6M3.2 8h9.6')], x: [P('M4 4l8 8M12 4l-8 8')],
      check: [P('M3 8.4l3.3 3.4L13 4.6')],
      trash: [P('M3 4.5h10M6.4 4.5V3.2h3.2v1.3M4.6 4.5l.6 8.3h5.6l.6-8.3')],
      undo: [P('M6.5 4L3 7.2l3.5 3.2'), P('M3 7.2h6.2a3.4 3.4 0 0 1 0 6.8H6.6')],
      redo: [P('M9.5 4L13 7.2l-3.5 3.2'), P('M13 7.2H6.8a3.4 3.4 0 0 0 0 6.8h2.6')],
      braces: [P('M6.2 3C4.6 3 5 5 5 6.2c0 1-.5 1.6-1.6 1.8 1.1.2 1.6.8 1.6 1.8C5 11 4.6 13 6.2 13'), P('M9.8 3c1.6 0 1.2 2 1.2 3.2 0 1 .5 1.6 1.6 1.8-1.1.2-1.6.8-1.6 1.8 0 1.2.4 3.2-1.2 3.2')],
      spark: [P('M8 2.2l1.3 3.9 3.9 1.3-3.9 1.3L8 12.6 6.7 8.7 2.8 7.4l3.9-1.3z')],

            return h('div', { key: t.key, style: { display: 'flex', flexDirection: 'column', gap: 5 } },
              h('div', { style: { display: 'flex', alignItems: 'center', justifyContent: 'space-between' } },
                h('div', { style: { display: 'flex', alignItems: 'center', gap: 8 } },
                  h('span', { style: { width: 14, height: 14, flex: 'none', display: 'flex', alignItems: 'center', justifyContent: 'center', borderRadius: T.chamfer ? 0 : 7, background: done ? T.a : 'transparent', border: done ? 'none' : `1.5px solid ${p > 0 ? T.a : T.bd2}` } }, done ? this.icon('check', 9, '#06080B') : p > 0 ? h('div', { style: { width: 6, height: 6, borderRadius: 6, border: `1.5px solid ${T.a}`, borderTopColor: 'transparent', animation: 'cvspin .7s linear infinite' } }) : null),
                  h('span', { style: { font: `500 11.5px ${T.mono}`, letterSpacing: '.06em', color: done || p > 0 ? T.ink : T.ink3 } }, 'THREAD_0' + (i + 1) + ' · ' + t.label)),
                h('span', { style: { font: `400 11px ${T.mono}`, color: done ? T.accent2 : T.ink3 } }, Math.round(p) + '%')),
              h('div', { style: { height: 3, background: T.sunk, borderRadius: 3, overflow: 'hidden' } },
                h('div', { style: { height: '100%', width: p + '%', background: done ? T.accent2 : T.a, transition: 'width .06s linear' } })));
          }))));
    }
    return h('div', { style: { height: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 24, position: 'relative', zIndex: 1 } },
      h('div', { style: { position: 'relative', textAlign: 'center', maxWidth: 460 } },
        h('div', { style: { width: 60, height: 60, ...this.panelBase({ chamfer: 14 }), display: 'flex', alignItems: 'center', justifyContent: 'center', margin: '0 auto 20px', color: T.ink3 } }, this.icon('doc', 26)),
        h('h2', { style: { font: `600 22px ${T.disp}`, color: T.ink, margin: '0 0 8px', letterSpacing: '.02em' } }, 'NO STRUCTURE DETECTED'),
        h('p', { style: { font: `400 14.5px/1.6 ${T.ui}`, color: T.ink2, margin: '0 0 24px' } }, 'Run inference against an uploaded document, or initialize a blank structure. The JSON is ground truth — every change here writes straight through it.'),
        h('div', { style: { display: 'flex', gap: 10, justifyContent: 'center' } },
          h('button', { className: 'cvprimary', onClick: () => this.startInfer(), style: { display: 'inline-flex', alignItems: 'center', gap: 8, padding: '11px 20px', border: 'none', borderRadius: T.btnRadius, background: T.a, color: '#06080B', font: `600 13px ${T.disp}`, letterSpacing: '.04em', cursor: 'pointer', boxShadow: `0 2px 18px ${T.a}55` } }, this.icon('spark', 16), 'RUN INFERENCE'),
          h('button', { className: 'cvghost', onClick: () => { this.setState({ view: 'blocks' }); this.loadCv(this.blankCv()); }, style: { display: 'inline-flex', alignItems: 'center', gap: 8, padding: '11px 18px', border: `1px solid ${T.bd2}`, borderRadius: T.btnRadius, background: T.surface, color: T.ink, font: `600 13px ${T.disp}`, letterSpacing: '.04em', cursor: 'pointer' } }, this.icon('plus', 16), 'INIT BLANK'))));
  }

  // ======================================================= JSON DRAWER
  renderDrawer() {
    const h = React.createElement, T = this.T;
    if (!this.state.cv || !this.state.jsonOpen) return null;
    const json = JSON.stringify(this.exportJson(), null, 2);
    const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    const colored = esc(json).replace(/("(?:\\.|[^"\\])*"(\s*:)?|\b(?:true|false|null)\b|-?\d+(?:\.\d+)?)/g, (m) => {
      let c = T.a;
      if (/^"/.test(m)) c = /:\s*$/.test(m) ? T.accent2 : '#8FE3A0';
      else if (/true|false|null/.test(m)) c = '#FF6FD8';
      return `<span style="color:${c}">${m}</span>`;
    });
    return h('aside', { style: { width: 400, flex: 'none', borderLeft: `1px solid ${T.bd}`, background: '#0A0E13', display: 'flex', flexDirection: 'column', minHeight: 0, position: 'relative', zIndex: 1 } },
      h('div', { style: { display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '12px 14px', borderBottom: `1px solid ${T.bd}`, flex: 'none' } },
        h('div', { style: { display: 'flex', alignItems: 'center', gap: 9 } },
          h('span', { style: { color: T.accent2 } }, this.icon('braces', 16)),
          h('div', null,
            h('div', { style: { font: `600 13px ${T.disp}`, color: T.ink, letterSpacing: '.03em' } }, 'SOURCE.JSON'),
            h('div', { style: { display: 'flex', alignItems: 'center', gap: 5, font: `500 10px ${T.mono}`, color: T.ink3, letterSpacing: '.04em' } },
              h('span', { style: { width: 6, height: 6, borderRadius: 6, background: T.accent2, boxShadow: `0 0 6px ${T.accent2}`, animation: 'cyblink 2s ease-in-out infinite' } }), 'LIVE · READ-ONLY · SCHEMA-VALID'))),
        h('div', { style: { display: 'flex', gap: 2 } },
          this.iconBtn('copy', () => { try { navigator.clipboard.writeText(json); } catch (x) {} }, { title: 'Copy JSON' }),
          this.iconBtn('x', () => this.setState({ jsonOpen: false }), { title: 'Close' }))),
      h('pre', { style: { margin: 0, flex: 1, overflow: 'auto', padding: '14px 16px', font: `400 12px/1.6 ${T.mono}`, color: T.ink, whiteSpace: 'pre', tabSize: 2 }, dangerouslySetInnerHTML: { __html: colored } }));
  }

  // ======================================================= SURFACE ROUTER
  renderSurface() {
    if (!this.state.cv || this.state.inferring) return this.renderEmpty();
    if (this.state.view === 'document') return this.renderDocument();
    if (this.state.view === 'split') return this.renderSplit();
    return this.renderBlocks();
  }

  renderVals() {
    return {
      themeStyle: this.renderThemeStyle(),
      ambient: this.renderAmbient(),
      topbar: this.renderTopbar(),
      surface: this.renderSurface(),
      drawer: this.renderDrawer(),
    };
  }
}

</script>
