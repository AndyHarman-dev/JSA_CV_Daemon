<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;height:100%}
    body{font-family:"IBM Plex Sans",system-ui,sans-serif;background:#070A0F;color:#E8EEF2;-webkit-font-smoothing:antialiased}
    textarea,input,button,select{font-family:inherit}
    @keyframes jsfade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
    @keyframes jsspin{to{transform:rotate(360deg)}}
    @keyframes jsblink{0%,49%{opacity:1}50%,100%{opacity:.2}}
    @keyframes jsscan{from{background-position:0 0}to{background-position:0 160vh}}
    ::selection{background:rgba(244,206,74,.3);color:#fff}
    ::-webkit-scrollbar{width:10px;height:10px}
    ::-webkit-scrollbar-thumb{background:#1C232C;border-radius:3px;border:2px solid transparent;background-clip:padding-box}
    .jrow{transition:background .12s,border-color .12s}
    .jbtn{transition:background .12s,color .12s,border-color .12s}
    .jbtn:hover{background:#1B232C}
    .jbtn:disabled{opacity:.35;cursor:default!important}
    .jghost{transition:background .12s,border-color .12s}
    .jprimary{transition:background .14s,box-shadow .14s,transform .05s}
    .jprimary:active{transform:translateY(1px)}
    .jdanger{transition:background .12s,border-color .12s,color .12s}
    .jta{transition:border-color .12s,box-shadow .12s}
    .jta:focus{outline:none}
    .jtab{transition:color .12s,border-color .12s}
  </style>
</helmet>
{{ themeStyle }}
<div style="height:100vh;display:flex;flex-direction:column;min-height:0;background:#070A0F;color:#E8EEF2;position:relative;overflow:hidden">
  {{ ambient }}
  {{ header }}
  <div style="flex:1;display:flex;min-height:0;overflow:hidden;position:relative;z-index:1">
    {{ jobList }}
    <main style="flex:1;min-width:0;overflow:auto;position:relative">{{ jobDetail }}</main>
  </div>
  {{ unfitOverlay }}
  <sc-if value="{{ editorOpen }}" hint-placeholder-val="{{ false }}">
    <div style="position:fixed;inset:0;z-index:60;background:#070A0F">
      <dc-import name="CV Structure Editor" accent="{{ editorAccent }}" skin="{{ editorSkin }}" telemetry="{{ editorTelemetry }}" on-exit="{{ closeEditor }}" style="display:block;width:100%;height:100%" hint-size="100%,100%"></dc-import>
    </div>
  </sc-if>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:&quot;100%&quot;},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;options&quot;:[&quot;#F4CE4A&quot;,&quot;#33E6E6&quot;,&quot;#FF4655&quot;,&quot;#FF2BD6&quot;],&quot;default&quot;:&quot;#F4CE4A&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Appearance&quot;},&quot;skin&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;terminal&quot;,&quot;hud&quot;],&quot;default&quot;:&quot;terminal&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Daemon&quot;},&quot;telemetry&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Daemon&quot;}}">
class Component extends DCLogic {
  GROUPS = [
    { label: 'Inbox', code: 'INBOX', states: ['awaiting_input'] },
    { label: 'Needs Review', code: 'FLAGGED', states: ['unfit'] },
    { label: 'Running', code: 'PROC', states: ['running', 'pending', 'fit_done', 'cv_done', 'cl_done'] },
    { label: 'Review', code: 'RVW', states: ['review'] },
    { label: 'Done', code: 'DONE', states: ['approved'] },
    { label: 'Failed', code: 'ERR', states: ['failed'] },
    { label: 'Dismissed', code: 'OFF', states: ['dismissed'] },
  ];
  STEPS = [
    { label: 'PENDING', key: 'pending' },
    { label: 'CV_ADJUST', key: 'cv_adjust' },
    { label: 'CV_DONE', key: 'cv_done' },
    { label: 'COVER_LETTER', key: 'cover_letter' },
    { label: 'CL_DONE', key: 'cl_done' },
    { label: 'REVIEW', key: 'review' },
    { label: 'APPROVED', key: 'approved' },
  ];

  state = {
    jobs: [],
    selectedId: null,
    jdOpen: false,
    reviewTab: 'cv',
    chatDraft: '',
    nuclearConfirmId: null,
    editorOpen: false,
    clockTick: 0,
    downloadMenuOpen: false,
    backendMenuOpen: false,
    backendQueue: [
      { id: 'claude-cli', label: 'CLAUDE CLI', status: 'active' },
      { id: 'google-cli', label: 'GOOGLE CLI (AGY)', status: 'standby' },
      { id: 'anthropic', label: 'ANTHROPIC API', status: 'standby' },
    ],
  };

  componentDidMount() {
    this._session = Array.from({ length: 6 }, () => '0123456789ABCDEF'[Math.floor(Math.random() * 16)]).join('');
    this._clockInt = setInterval(() => this.setState(s => ({ clockTick: (s.clockTick || 0) + 1 })), 1000);
    this.setState({ jobs: this.sampleJobs(), selectedId: 'j1' });
  }
  componentWillUnmount() { clearInterval(this._clockInt); }

  sampleJobs() {
    return [
      { id: 'j1', company: 'Stripe', role: 'Senior Backend Engineer', tier: 'A', state: 'awaiting_input', current_stage: 'cv_adjust', retry_count: 0, error: null, fit_reason: null,
        jd: 'We are looking for a senior backend engineer to own core payments infrastructure. You will design APIs used by millions of businesses, work closely with risk and compliance, and mentor junior engineers. 5+ years experience with distributed systems required.',
        followUp: { question: 'Your resume lists "led a team" at Voltline but doesn\u2019t specify team size or whether this was a formal management role. Can you clarify so I tailor the leadership framing correctly?' } },
      { id: 'j2', company: 'General Dynamics', role: 'Mechanical QA Lead', tier: 'C', state: 'unfit', current_stage: null, retry_count: 0, error: null,
        fit_reason: 'This role requires an active DoD security clearance and 8+ years in mechanical QA for defense hardware. Your background is software engineering with no clearance history — the mismatch is structural, not just resume framing.',
        jd: 'Lead quality assurance for precision mechanical assemblies in defense manufacturing. Active Secret clearance required.' },
      { id: 'j3', company: 'Anthropic', role: 'Applied AI Engineer', tier: 'A', state: 'running', current_stage: 'cv_adjust', retry_count: 0, error: null, fit_reason: null,
        jd: 'Build applied systems on top of frontier models for enterprise customers. Strong systems + ML fundamentals.' },
      { id: 'j4', company: 'Vercel', role: 'Platform Engineer', tier: 'B', state: 'pending', current_stage: null, retry_count: 0, error: null, fit_reason: null,
        jd: 'Own the edge runtime that powers millions of deployments. Rust or Go experience a plus.' },
      { id: 'j5', company: 'Replit', role: 'Staff Frontend Engineer', tier: 'A', state: 'review', current_stage: null, retry_count: 0, error: null, fit_reason: null,
        jd: 'Staff-level frontend role shaping the in-browser IDE experience for millions of developers.', cvVersion: 2, clVersion: 1 },
      { id: 'j6', company: 'Notion', role: 'Backend Engineer', tier: 'A', state: 'approved', current_stage: null, retry_count: 0, error: null, fit_reason: null,
        jd: 'Backend engineer for the core docs collaboration engine.', cvVersion: 1, clVersion: 1 },
      { id: 'j7', company: 'Scale AI', role: 'ML Infra Engineer', tier: 'B', state: 'failed', current_stage: 'cover_letter', retry_count: 1, fit_reason: null,
        error: 'Agent backend returned a malformed sentinel block while generating the cover letter (missing <<<END>>> terminator). Job marked failed after 3 retries.',
        jd: 'ML infrastructure engineer for training cluster reliability.' },
      { id: 'j8', company: 'Hexbloom Studio', role: 'Growth Hacker', tier: 'C', state: 'dismissed', current_stage: null, retry_count: 0, error: null, fit_reason: null,
        jd: 'Growth role at an early-stage startup.' },
    ];
  }

  get accent() { return this.props.accent ?? '#F4CE4A'; }
  get T() {
    const a = this.accent;
    const chamfer = (this.props.skin ?? 'terminal') === 'hud';
    return {
      a, accent2: '#33E6E6', danger: '#FF4655', violet: '#9D7BFF', green: '#8FE3A0',
      ui: '"IBM Plex Sans", system-ui, sans-serif', mono: '"Share Tech Mono", ui-monospace, monospace', disp: '"Chakra Petch", system-ui, sans-serif',
      canvas: '#070A0F', surface: '#10151D', subtle: '#0E141B', sunk: '#0B0F15',
      bd: 'rgba(140,190,210,0.16)', bd2: 'rgba(140,190,210,0.30)',
      ink: '#E8EEF2', ink2: '#8B97A6', ink3: '#4D5868',
      aSoft: `color-mix(in srgb, ${a} 14%, #10151D)`, aBorder: `color-mix(in srgb, ${a} 55%, #10151D)`,
      chamfer, radius: chamfer ? 0 : 3, btnRadius: chamfer ? 7 : 2,
      shadowSm: '0 1px 2px rgba(0,0,0,.4)', shadowMd: '0 10px 32px rgba(0,0,0,.55)',
    };
  }
  STATE_META(T) { return {
    pending: { label: 'PENDING', code: 'STDBY', color: T.ink2 },
    running: { label: 'RUNNING', code: 'PROC', color: T.accent2, spin: true },
    awaiting_input: { label: 'NEEDS INPUT', code: 'WAIT', color: T.a },
    fit_done: { label: 'ASSESSED', code: 'CHK', color: T.accent2 },
    unfit: { label: 'NEEDS REVIEW', code: 'FLAG', color: T.a },
    cv_done: { label: 'CV DONE', code: 'CV_OK', color: T.accent2 },
    cl_done: { label: 'CL DONE', code: 'CL_OK', color: T.accent2 },
    review: { label: 'REVIEW', code: 'RVW', color: T.violet },
    approved: { label: 'APPROVED', code: 'DONE', color: T.green },
    failed: { label: 'FAILED', code: 'ERR', color: T.danger },
    dismissed: { label: 'DISMISSED', code: 'OFF', color: T.ink3 },
  }; }

  job(id) { return this.state.jobs.find(j => j.id === id); }
  patchJob(id, patch) { this.setState(s => ({ jobs: s.jobs.map(j => j.id === id ? { ...j, ...patch } : j) })); }
  selectJob(id) { this.setState({ selectedId: id, jdOpen: false, reviewTab: 'cv', chatDraft: '', nuclearConfirmId: null, downloadMenuOpen: false }); }

  activeStepIndex(job) {
    const st = job.state, cs = job.current_stage;
    const adj = (cs === 'cv_adjust' || cs === 'revising_cv') ? 1 : (cs === 'cover_letter' || cs === 'revising_cl') ? 3 : 0;
    switch (st) {
      case 'pending': return 0; case 'fit_done': return 0; case 'unfit': return 0;
      case 'running': return adj || 1; case 'awaiting_input': return adj || 1;
      case 'cv_done': return 2; case 'cl_done': return 4;
      case 'review': return 5; case 'approved': return 6;
      case 'failed': return adj; case 'dismissed': return 0;
      default: return 0;
    }
  }

  // ---- mock actions ----
  doDismiss(job) { this.patchJob(job.id, { state: 'dismissed' }); }
  doRequeue(job) { this.patchJob(job.id, { state: 'pending', error: null, current_stage: null }); }
  doRetry(job) {
    if (job.retry_count > 0) { this.setState({ nuclearConfirmId: job.id }); return; }
    this.patchJob(job.id, { state: 'pending', error: null, retry_count: job.retry_count + 1 });
  }
  doNuclearConfirm(job) { this.patchJob(job.id, { state: 'pending', error: null, retry_count: job.retry_count + 1 }); this.setState({ nuclearConfirmId: null }); }
  doDelete(job) {
    this.setState(s => ({ jobs: s.jobs.filter(j => j.id !== job.id), selectedId: s.selectedId === job.id ? null : s.selectedId }));
  }
  doIgnoreFit(job) { this.patchJob(job.id, { state: 'fit_done' }); }
  doApprove(job) { this.patchJob(job.id, { state: 'approved' }); }
  doSubmitAnswer(job) {
    const text = this.state.chatDraft.trim(); if (!text) return;
    this.patchJob(job.id, { state: 'running', followUp: null });
    this.setState({ chatDraft: '' });
  }
  doSubmitRevision(job) {
    const text = this.state.chatDraft.trim(); if (!text) return;
    const key = this.state.reviewTab === 'cv' ? 'cvVersion' : 'clVersion';
    this.patchJob(job.id, { [key]: (job[key] || 1) + 1 });
    this.setState({ chatDraft: '' });
  }

  // ======================================================= ICONS
  icon(name, sz, color) {
    const h = React.createElement, P = (d, extra) => h('path', { d, ...extra });
    const map = {
      x: [P('M4 4l8 8M12 4l-8 8')], plus: [P('M8 3.2v9.6M3.2 8h9.6')], check: [P('M3 8.4l3.3 3.4L13 4.6')],
      trash: [P('M3 4.5h10M6.4 4.5V3.2h3.2v1.3M4.6 4.5l.6 8.3h5.6l.6-8.3')],
      refresh: [P('M3 7.6a5 5 0 0 1 8.8-3.2M13 3v3.4h-3.4'), P('M13 8.4a5 5 0 0 1-8.8 3.2M3 13V9.6h3.4')],
      send: [P('M2.5 8L13 3l-3.6 10.5-2-4.7-4.9-1.8z')],
      download: [P('M8 2.5v7.2M5 7l3 2.7L11 7'), P('M3 12.5h10')],
      chevron: [P('M5 5.5L8 9l3-3.5')],
      alert: [P('M8 2.5l6.2 11H1.8z'), h('line', { x1: 8, y1: 6.4, x2: 8, y2: 9.4 }), h('circle', { cx: 8, cy: 11.4, r: .35, fill: 'currentColor', stroke: 'none' })],
      mail: [h('rect', { x: 2, y: 3.5, width: 12, height: 9, rx: 1.2 }), P('M2.5 4.5l5.5 4.5 5.5-4.5')],
      phone: [P('M4 2.5h2l1 3-1.4 1.2a8 8 0 0 0 3.7 3.7l1.2-1.4 3 1V13a1 1 0 0 1-1 1C7.8 14 2 8.2 2 3.5a1 1 0 0 1 1-1z')],
      pin: [P('M8 14s4.5-4.4 4.5-7.8a4.5 4.5 0 1 0-9 0C3.5 9.6 8 14 8 14z'), h('circle', { cx: 8, cy: 6.2, r: 1.5 })],
      bolt: [P('M8.6 1.8L3 9h3.4l-1 5.2L13 7H9.4z')],
      server: [h('rect', { x: 2.5, y: 2.5, width: 11, height: 4.2, rx: 1 }), h('rect', { x: 2.5, y: 9.3, width: 11, height: 4.2, rx: 1 }), h('circle', { cx: 11, cy: 4.6, r: .55, fill: 'currentColor', stroke: 'none' }), h('circle', { cx: 11, cy: 11.4, r: .55, fill: 'currentColor', stroke: 'none' })],
      inbox: [P('M2 3.2h12v9.6H2z'), P('M2 8h3.4l1 2h3.2l1-2H14')],
      doc: [h('rect', { x: 3.5, y: 2.2, width: 9, height: 11.6, rx: 1.2 }), P('M5.8 5.4h4.4M5.8 8h4.4M5.8 10.6h2.6')],
      work: [h('rect', { x: 2.5, y: 5, width: 11, height: 7.5, rx: 1.2 }), P('M6 5V4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v1')],
      link: [P('M6.5 9.5l3-3M7 5.2l.8-.8a2.4 2.4 0 0 1 3.4 3.4l-.9.9M9 10.8l-.8.8a2.4 2.4 0 0 1-3.4-3.4l.9-.9')],
      back: [P('M10.5 3.5L5 8l5.5 4.5')],
    };
    return h('svg', { width: sz, height: sz, viewBox: '0 0 16 16', fill: 'none', stroke: 'currentColor', strokeWidth: 1.55, strokeLinecap: 'round', strokeLinejoin: 'round', style: { display: 'block', color: color || 'currentColor', flex: 'none' } }, map[name] || []);
  }

  chamferPath(c) { return `polygon(0 0, calc(100% - ${c}px) 0, 100% ${c}px, 100% 100%, ${c}px 100%, 0 calc(100% - ${c}px))`; }
  panelBase(T, o = {}) {
    const st = { background: o.bg || T.surface, border: `1px solid ${o.border || T.bd}` };
    if (T.chamfer) { st.clipPath = this.chamferPath(o.chamfer || 12); st.borderRadius = 0; } else st.borderRadius = o.radius != null ? o.radius : T.radius;
    return st;
  }
  cornerMarks(T, color, sz, thick) {
    const h = React.createElement; if (T.chamfer) return [];
    sz = sz || 9; thick = thick || 2;
    const base = { position: 'absolute', width: sz, height: sz, pointerEvents: 'none' };
    return [
      h('span', { key: 'a', style: { ...base, top: -1, left: -1, borderTop: `${thick}px solid ${color}`, borderLeft: `${thick}px solid ${color}` } }),
      h('span', { key: 'b', style: { ...base, top: -1, right: -1, borderTop: `${thick}px solid ${color}`, borderRight: `${thick}px solid ${color}` } }),
      h('span', { key: 'c', style: { ...base, bottom: -1, left: -1, borderBottom: `${thick}px solid ${color}`, borderLeft: `${thick}px solid ${color}` } }),
      h('span', { key: 'd', style: { ...base, bottom: -1, right: -1, borderBottom: `${thick}px solid ${color}`, borderRight: `${thick}px solid ${color}` } }),
    ];
  }

  badge(state) {
    const h = React.createElement, T = this.T, m = this.STATE_META(T)[state];
    return h('span', { style: { display: 'inline-flex', alignItems: 'center', gap: 5, padding: '3px 8px', borderRadius: T.btnRadius, font: `500 10px ${T.mono}`, letterSpacing: '.06em', color: m.color, background: `color-mix(in srgb, ${m.color} 12%, ${T.sunk})`, border: `1px solid color-mix(in srgb, ${m.color} 40%, ${T.bd})`, flex: 'none' } },
      m.spin ? h('span', { style: { width: 6, height: 6, borderRadius: 6, border: `1.5px solid ${m.color}`, borderTopColor: 'transparent', animation: 'jsspin .7s linear infinite' } }) : h('span', { style: { width: 5, height: 5, borderRadius: 5, background: m.color, boxShadow: `0 0 5px ${m.color}` } }),
      m.label);
  }

  // ======================================================= AMBIENT / THEME
  renderThemeStyle() { const h = React.createElement, T = this.T; return h('style', null, `:root{--a:${T.a}}`); }
  renderAmbient() {
    const h = React.createElement, T = this.T;
    if (this.props.telemetry === false) return null;
    const grid = h('div', { key: 'g', style: { position: 'absolute', inset: 0, pointerEvents: 'none', zIndex: 0,
      backgroundImage: 'linear-gradient(rgba(51,230,230,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(51,230,230,.05) 1px,transparent 1px)',
      backgroundSize: '40px 40px', WebkitMaskImage: 'radial-gradient(ellipse at 50% 0%, black 0%, transparent 70%)', maskImage: 'radial-gradient(ellipse at 50% 0%, black 0%, transparent 70%)' } });
    const scan = h('div', { key: 's', style: { position: 'absolute', inset: 0, pointerEvents: 'none', zIndex: 0, overflow: 'hidden',
      backgroundImage: 'linear-gradient(180deg, transparent 0%, transparent 38%, rgba(51,230,230,.045) 50%, transparent 62%, transparent 100%)',
      backgroundSize: '100% 160vh', backgroundRepeat: 'repeat-y', animation: 'jsscan 16s linear infinite' } });
    const corner = h('div', { key: 'c', style: { position: 'absolute', right: 14, bottom: 10, pointerEvents: 'none', zIndex: 0, font: `400 10px ${T.mono}`, color: 'rgba(139,151,166,.32)', letterSpacing: '.06em' } },
      `JSA_DAEMON // SESSION 0x${this._session || '000000'} // SYNC ${8 + ((this.state.clockTick || 0) % 7)}ms`);
    return h('div', { style: { position: 'absolute', inset: 0, zIndex: 0 } }, grid, scan, corner);
  }

  // ======================================================= BACKEND QUEUE
  renderBackendCluster() {
    const h = React.createElement, T = this.T, queue = this.state.backendQueue;
    const active = queue.find(b => b.status === 'active') || queue[0];
    const standbyCount = queue.filter(b => b.status === 'standby').length;
    const menu = this.state.backendMenuOpen ? h('div', { style: { position: 'absolute', top: '100%', left: 0, marginTop: 6, width: 240, zIndex: 30, ...this.panelBase(T, { chamfer: 10 }), boxShadow: T.shadowMd, padding: 5 } },
      ...this.cornerMarks(T, T.bd2, 8),
      h('div', { style: { font: `600 9.5px ${T.mono}`, letterSpacing: '.12em', color: T.ink3, textTransform: 'uppercase', padding: '5px 9px 7px' } }, 'BACKEND FAILOVER QUEUE'),
      ...queue.map((b, i) => {
        const isActive = b.status === 'active';
        const color = isActive ? T.accent2 : T.ink3;
        return h('div', { key: b.id, style: { display: 'flex', alignItems: 'center', gap: 9, padding: '7px 9px', borderRadius: T.btnRadius, background: isActive ? T.aSoft : 'transparent' } },
          h('span', { style: { font: `600 10px ${T.mono}`, color: T.ink3, width: 14, flex: 'none' } }, i + 1),
          isActive ? h('span', { style: { width: 6, height: 6, borderRadius: 6, background: color, boxShadow: `0 0 6px ${color}`, animation: 'jsblink 2s ease-in-out infinite', flex: 'none' } }) : h('span', { style: { width: 6, height: 6, borderRadius: 6, border: `1.5px solid ${color}`, flex: 'none' } }),
          h('span', { style: { font: `500 12px ${T.ui}`, color: isActive ? T.ink : T.ink2, flex: 1 } }, b.label),
          h('span', { style: { font: `500 9px ${T.mono}`, color, letterSpacing: '.05em' } }, isActive ? 'ACTIVE' : 'STANDBY'));
      }),
      h('div', { style: { font: `400 10.5px/1.5 ${T.ui}`, color: T.ink3, padding: '8px 9px 4px', borderTop: `1px solid ${T.bd}`, marginTop: 3 } }, 'On repeated failure, the daemon fails over to the next backend in this order.')) : null;

    return h('div', { style: { position: 'relative' } },
      h('button', { className: 'jghost', onClick: () => this.setState(s => ({ backendMenuOpen: !s.backendMenuOpen })), title: 'Active backend / failover queue', style: { display: 'inline-flex', alignItems: 'center', gap: 7, padding: '5px 10px', border: `1px solid ${T.bd}`, borderRadius: T.btnRadius, background: T.sunk, color: T.ink2, cursor: 'pointer' } },
        h('span', { style: { color: T.accent2, display: 'flex' } }, this.icon('server', 13)),
        h('span', { style: { font: `500 10.5px ${T.mono}`, color: T.ink3, letterSpacing: '.06em' } }, 'BACKEND'),
        h('span', { style: { font: `600 11px ${T.mono}`, color: T.ink } }, active.label),
        standbyCount > 0 && h('span', { style: { font: `500 9.5px ${T.mono}`, color: T.ink3, background: T.surface, border: `1px solid ${T.bd}`, borderRadius: T.btnRadius, padding: '1px 5px' } }, '+' + standbyCount),
        h('span', { style: { color: T.ink3, transform: this.state.backendMenuOpen ? 'rotate(180deg)' : 'none', transition: 'transform .12s', display: 'flex' } }, this.icon('chevron', 9))),
      menu);
  }

  // ======================================================= HEADER
  renderHeader() {

        h('div', { style: { font: `400 11.5px ${T.mono}`, color: T.ink3, marginBottom: 14 } }, job.company + ' — ' + job.role),
        h('div', { style: { ...this.panelBase(T, { bg: T.aSoft, border: `1px solid ${T.aBorder}`, chamfer: 8 }), padding: '11px 13px', font: `400 13.5px/1.55 ${T.ui}`, color: T.ink, marginBottom: 14 } }, job.fit_reason),
        h('p', { style: { font: `400 13px/1.5 ${T.ui}`, color: T.ink2, margin: '0 0 18px' } }, 'Dismiss this job, or override the assessment and tailor your application anyway.'),
        h('div', { style: { display: 'flex', justifyContent: 'flex-end', gap: 8 } },
          this.actionBtn('Ignore & Continue', () => this.doIgnoreFit(job)),
          this.actionBtn('Dismiss Job', () => this.doDismiss(job), { danger: true }))));
  }

  renderVals() {
    return {
      themeStyle: this.renderThemeStyle(),
      ambient: this.renderAmbient(),
      header: this.renderHeader(),
      jobList: this.renderJobList(),
      jobDetail: this.renderJobDetail(),
      unfitOverlay: this.renderUnfit(),
      editorOpen: this.state.editorOpen,
      closeEditor: () => this.setState({ editorOpen: false }),
      editorAccent: this.accent,
      editorSkin: this.props.skin ?? 'terminal',
      editorTelemetry: this.props.telemetry ?? true,
    };
  }
}

</script>
</body>
</html>
