[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jsa"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "typer>=0.12",
    "pydantic-settings>=2.2",
    "python-docx>=1.1",
    "pypdf>=4.2",
    "weasyprint>=62",
    "markdown-it-py>=3.0",
    "ptyprocess>=0.7",
    "anthropic>=0.26",
]

[project.scripts]
jsa = "jsa.cli:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
